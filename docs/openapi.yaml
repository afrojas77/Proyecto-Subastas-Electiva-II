openapi: 3.0.3
info:
  title: API de Subastas
  version: 1.0.0
  description: API académica para publicar, consultar, pujar, cancelar y cerrar subastas.
servers:
  - url: http://localhost:3000
paths:
  /api/users/register:
    post:
      summary: Registra un usuario
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterUserRequest' }
      responses:
        '201':
          description: Usuario registrado sin datos de credencial
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/auth/login:
    post:
      summary: Autentica un usuario
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Token Bearer emitido correctamente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/users/me:
    get:
      summary: Consulta el perfil del usuario autenticado
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Perfil propio sin hash de contraseña
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticatedProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auctions:
    get:
      summary: Lista subastas con filtros y paginación
      parameters:
        - name: category
          in: query
          schema: { type: string }
          description: Nombre exacto de la categoría.
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, CANCELLED, CLOSED, DESERTED, DEFAULTED]
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Página de subastas y metadatos del resultado filtrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuctionPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      summary: Publica una subasta
      description: El vendedor se obtiene exclusivamente del token. Enviar sellerId en el cuerpo produce un error 400.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishAuctionRequest'
      responses:
        '201':
          description: Subasta publicada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuctionSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auctions/{id}:
    get:
      summary: Consulta el detalle y el historial de una subasta
      description: Requiere un usuario registrado. Si la subasta sigue abierta y el instante actual alcanzó closesAt, la cierra, adjudica y persiste la orden antes de responder.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/AuctionId' }]
      responses:
        '200':
          description: Subasta encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuctionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/auctions/{id}/bids:
    get:
      summary: Consulta el historial de pujas como usuario registrado
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/AuctionId' }]
      responses:
        '200':
          description: Historial sin datos de contacto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BidHistory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Registra una puja
      description: El postor se obtiene exclusivamente del token. Enviar bidderId en el cuerpo produce un error 400. Si closesAt ya fue alcanzado, primero se cierra la subasta y la puja tardía se rechaza con AUCTION_NOT_OPEN.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/AuctionId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceBidRequest'
      responses:
        '201':
          description: Puja aceptada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bid' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/auctions/{id}/cancel:
    post:
      summary: Cancela una subasta sin pujas
      description: Sólo el vendedor autenticado propietario puede cancelar.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/AuctionId' }]
      responses:
        '200':
          description: Subasta cancelada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuctionSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/auctions/{id}/close:
    post:
      summary: Cierra manualmente una subasta como vendedor
      description: Operación idempotente conservada por compatibilidad. Sólo el vendedor autenticado puede ejecutarla y nunca permite cerrar antes de closesAt.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/AuctionId' }]
      responses:
        '200':
          description: Resultado de cierre idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuctionClosure' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/payments/webhook:
    post:
      summary: Recibe una notificación de la pasarela simulada de desarrollo
      description: El secreto compartido simulado no sustituye la verificación criptográfica de una pasarela real.
      parameters:
        - name: x-simulated-payment-webhook-secret
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentNotificationRequest'
      responses:
        '200':
          description: Evento procesado o respuesta original de un reintento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentProcessingResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/payment-orders/{id}:
    get:
      summary: Consulta una orden de pago como ganador
      description: La identidad se obtiene exclusivamente del token y debe coincidir con el deudor ganador. Si la orden pendiente alcanzó dueAt, la consulta procesa atómicamente su vencimiento y el incumplimiento de la subasta antes de responder.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Orden propia sin información privada adicional
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AuctionId:
      name: id
      in: path
      required: true
      schema: { type: string }
  schemas:
    RegisterUserRequest:
      type: object
      required: [name, documentType, documentNumber, phone, email, password]
      properties:
        name: { type: string, maxLength: 200 }
        documentType: { type: string, enum: [CC, CE, PASSPORT] }
        documentNumber:
          {
            type: string,
            minLength: 5,
            maxLength: 30,
            pattern: '^[A-Za-z0-9-]+$',
          }
        phone:
          { type: string, minLength: 7, maxLength: 16, pattern: '^\+?[0-9]+$' }
        email: { type: string, format: email }
        password:
          type: string
          format: password
          minLength: 8
          description: Entre 8 caracteres y 72 bytes; nunca se devuelve.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    UserProfile:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string }
        name: { type: string, nullable: true }
        email: { type: string, format: email }
        documentType: { type: string, enum: [CC, CE, PASSPORT] }
        documentNumber: { type: string }
        phone: { type: string }
    ProfileAuctionSummary:
      type: object
      required:
        [
          id,
          sellerId,
          article,
          category,
          basePrice,
          minimumIncrement,
          publishedAt,
          status,
          closesAt,
        ]
      properties:
        id: { type: string }
        sellerId: { type: string }
        article:
          type: object
          required: [denomination, description, conservationState]
          properties:
            denomination: { type: string }
            description: { type: string }
            conservationState:
              { type: string, enum: [NEW, LIKE_NEW, USED, RESTORED] }
        category: { type: string }
        basePrice: { type: integer, minimum: 1 }
        minimumIncrement: { type: integer, minimum: 1 }
        publishedAt: { type: string, format: date-time }
        status:
          { type: string, enum: [OPEN, CANCELLED, CLOSED, DESERTED, DEFAULTED] }
        closesAt: { type: string, format: date-time }
        winnerId: { type: string }
        highestBid:
          type: object
          required: [bidderId, amount]
          properties:
            bidderId: { type: string }
            amount: { type: integer, minimum: 0 }
        userLastBid:
          type: object
          required: [amount, placedAt]
          properties:
            amount: { type: integer, minimum: 0 }
            placedAt: { type: string, format: date-time }
    AuthenticatedProfile:
      allOf:
        - { $ref: '#/components/schemas/UserProfile' }
        - type: object
          required: [publishedAuctions, participatedAuctions]
          properties:
            publishedAuctions:
              type: array
              items: { $ref: '#/components/schemas/ProfileAuctionSummary' }
            participatedAuctions:
              type: array
              items: { $ref: '#/components/schemas/ProfileAuctionSummary' }
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresAt, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/UserProfile' }
    PublishAuctionRequest:
      type: object
      required: [id, article, category, basePrice, minimumIncrement, closesAt]
      properties:
        id: { type: string }
        article:
          type: object
          required: [denomination, description, conservationState]
          properties:
            denomination: { type: string }
            description: { type: string }
            conservationState:
              { type: string, enum: [NEW, LIKE_NEW, USED, RESTORED] }
        category: { type: string }
        basePrice: { type: integer, minimum: 1 }
        minimumIncrement: { type: integer, minimum: 1 }
        closesAt: { type: string, format: date-time }
    PlaceBidRequest:
      type: object
      required: [id, amount]
      properties:
        id: { type: string }
        amount: { type: integer, minimum: 0 }
    AuctionSummary:
      type: object
      required:
        [
          id,
          sellerId,
          article,
          category,
          basePrice,
          minimumIncrement,
          publishedAt,
          closesAt,
          status,
        ]
      properties:
        id: { type: string }
        sellerId: { type: string }
        article: { type: object }
        category: { type: string }
        basePrice: { type: integer, minimum: 0 }
        minimumIncrement: { type: integer, minimum: 0 }
        publishedAt: { type: string, format: date-time }
        closesAt: { type: string, format: date-time }
        status:
          { type: string, enum: [OPEN, CANCELLED, CLOSED, DESERTED, DEFAULTED] }
        winnerId: { type: string, nullable: true }
    AuctionPage:
      type: object
      required: [auctions, page, limit, total, totalPages]
      properties:
        auctions:
          type: array
          items: { $ref: '#/components/schemas/AuctionSummary' }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    AuctionDetail:
      allOf:
        - { $ref: '#/components/schemas/AuctionSummary' }
        - type: object
          required: [highestBid, bids]
          properties:
            highestBid:
              nullable: true
              allOf:
                - { $ref: '#/components/schemas/Bid' }
            bids:
              type: array
              items: { $ref: '#/components/schemas/Bid' }
    Bid:
      type: object
      required: [id, bidderId, amount, placedAt, sequence]
      properties:
        id: { type: string }
        bidderId: { type: string }
        amount: { type: integer, minimum: 0 }
        placedAt: { type: string, format: date-time }
        sequence: { type: integer, minimum: 1 }
    BidHistory:
      type: object
      required: [auctionId, bids]
      properties:
        auctionId: { type: string }
        bids:
          type: array
          items: { $ref: '#/components/schemas/Bid' }
    AuctionClosure:
      type: object
      required: [auctionId, status]
      properties:
        auctionId: { type: string }
        status: { type: string, enum: [CLOSED, DESERTED, DEFAULTED] }
        winnerId: { type: string, nullable: true }
        winningBid: { $ref: '#/components/schemas/Bid' }
        paymentOrder:
          allOf:
            - { $ref: '#/components/schemas/PaymentOrder' }
            - type: object
              properties:
                debtorId: { type: string }
    PaymentOrder:
      type: object
      required: [id, auctionId, amount, status, createdAt, dueAt]
      properties:
        id: { type: string }
        auctionId: { type: string }
        amount: { type: integer, minimum: 0 }
        status: { type: string, enum: [PENDING, PAID, EXPIRED] }
        createdAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }
    PaymentNotificationRequest:
      type: object
      required: [id, paymentOrderId, result, occurredAt]
      properties:
        id: { type: string }
        paymentOrderId: { type: string }
        result: { type: string, enum: [APPROVED, REJECTED] }
        occurredAt: { type: string, format: date-time }
    PaymentProcessingResponse:
      type: object
      required: [eventId, paymentOrderId, result, orderStatus]
      properties:
        eventId: { type: string }
        paymentOrderId: { type: string }
        result: { type: string, enum: [APPROVED, REJECTED] }
        orderStatus: { type: string, enum: [PENDING, PAID, EXPIRED] }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    BadRequest:
      description: Datos inválidos o regla de negocio rechazada
      content:
        { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Recurso inexistente
      content:
        { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Conflicto de estado
      content:
        { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Token o credenciales inválidos, u origen no verificado
      content:
        { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Usuario autenticado sin permiso sobre el recurso
      content:
        { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
